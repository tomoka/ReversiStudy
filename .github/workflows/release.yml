name: release

# v1.2.3 のようなタグを打つと、署名済み APK をビルドして Releases に添付する。
# 署名鍵はリポジトリに置かず、GitHub の Secrets から渡す。
#   KEYSTORE_BASE64        … 鍵ファイルを base64 にしたもの
#   RELEASE_STORE_PASSWORD … キーストアのパスワード
#   RELEASE_KEY_ALIAS      … 鍵のエイリアス
#   RELEASE_KEY_PASSWORD   … 鍵のパスワード
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 を用意する
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: SDK のパッケージを入れる
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: 署名鍵を復元する
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 が設定されていません。README のリリース手順を参照してください。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: ユニットテスト
        run: ./gradlew --no-daemon test

      - name: リリース APK をビルド
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Releases に添付する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
